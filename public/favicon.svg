<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- orbital ring -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <!-- planet body -->
  <circle cx="16" cy="16" r="7" fill="url(#planet)"/>
  <!-- small star accent -->
  <circle cx="26" cy="7" r="1.2" fill="#fbbf24"/>
  <defs>
    <radialGradient id="planet" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a7d3ff"/>
      <stop offset="55%" stop-color="#3f7fd4"/>
      <stop offset="100%" stop-color="#173a75"/>
    </radialGradient>
  </defs>
</svg>
